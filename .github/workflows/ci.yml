name: ci

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm ci
      - run: npm run lint
        env:
          NODE_ENV: test
      - run: npm run type-check
        env:
          NODE_ENV: test
      - run: npm run test:coverage
        env:
          NODE_ENV: test
      - run: npm run web:build
        env:
          NODE_ENV: production
